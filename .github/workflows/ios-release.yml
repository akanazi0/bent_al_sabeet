name: iOS Release to TestFlight

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  FLUTTER_VERSION: '3.41.x'

jobs:
  build-and-deploy-ios:
    name: Build & Deploy to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # ──────────────────────────────────────
      # 1. Checkout Code
      # ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────
      # 2. Setup Flutter
      # ──────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ──────────────────────────────────────
      # 3. Dynamic Versioning
      # ──────────────────────────────────────
      - name: Set build number from run number
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          BUILD_NUMBER=${{ github.run_number }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "📦 Building version: $VERSION+$BUILD_NUMBER"

      # ──────────────────────────────────────
      # 4. Install Dependencies
      # ──────────────────────────────────────
      - name: Get Flutter dependencies
        run: flutter pub get

      # ──────────────────────────────────────
      # 5. Setup Apple Code Signing
      # ──────────────────────────────────────
      - name: Install Apple certificate and provisioning profile
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temp file paths
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode from base64
          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          # Download and install Apple WWDR intermediate certificate
          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import Apple WWDR intermediate certificate
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign

          # Import distribution certificate
          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add keychain to search list (include system keychains)
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychain -d user | tr -d '"')

          # Debug: verify certificates are installed
          echo "=== Installed certificates ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH
          echo "=== End certificates ==="

          # Install provisioning profile with correct UUID filename
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PROFILE_PATH))
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "✅ Profile installed: $PROFILE_UUID"

      # ──────────────────────────────────────
      # 5.5. Configure Xcode for Manual Signing
      # ──────────────────────────────────────
      - name: Configure Xcode signing
        run: |
          cd ios
          # Explicitly set manual signing for the Runner Release target (97C147071CF9000F007C117D)
          # We inject the settings right after 'buildSettings = {'
          sed -i '' '/97C147071CF9000F007C117D \/\* Release \*\/ = {/,/name = Release;/ s/buildSettings = {/buildSettings = {\
          				CODE_SIGN_STYLE = Manual;\
          				DEVELOPMENT_TEAM = W3KXF5MMWC;\
          				"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\
          				PROVISIONING_PROFILE = "${{ env.PROFILE_UUID }}";\
          				PROVISIONING_PROFILE_SPECIFIER = "${{ env.PROFILE_UUID }}";/' Runner.xcodeproj/project.pbxproj
          
          # Also ensure RunnerTests (if any) don't conflict, though usually ignored for IPA
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' Runner.xcodeproj/project.pbxproj
          
          echo "✅ Xcode configured for manual signing (Runner Release target updated)"
          # Debug: print the updated block to verify
          grep -A 20 "97C147071CF9000F007C117D /\* Release \*/" Runner.xcodeproj/project.pbxproj

      # ──────────────────────────────────────
      # 6. Build the IPA
      # ──────────────────────────────────────
      - name: Build Flutter IPA
        run: |
          flutter build ipa \
            --release \
            --build-name=${{ env.VERSION }} \
            --build-number=${{ env.BUILD_NUMBER }} \
            --export-options-plist=ios/ExportOptions.plist

      # ──────────────────────────────────────
      # 7. Upload to TestFlight
      # ──────────────────────────────────────
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Write the API key to the expected location
          mkdir -p ~/.private_keys
          
          # Handle potentially malformed secret (restore newlines if user pasted as one line)
          # We use a temp file to process the key
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > $RUNNER_TEMP/private_key_raw
          
          # If the key doesn't have multiple lines (checked by wc -l), we assume it needs formatting
          if [ $(wc -l < $RUNNER_TEMP/private_key_raw) -lt 2 ]; then
            echo "⚠️ Correcting one-line private key format..."
            sed -e 's/-----BEGIN PRIVATE KEY-----/&\n/' -e 's/-----END PRIVATE KEY-----/\n&/' -e 's/\S\{64\}/&\n/g' $RUNNER_TEMP/private_key_raw > ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          else
            cp $RUNNER_TEMP/private_key_raw ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          fi
          
          # Verify key file creation
          ls -lh ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

          # Find the built IPA
          # flutter build ipa by default outputs to build/ios/ipa
          # We search broadly just in case
          IPA_PATH=$(find build/ios -name "*.ipa" -type f | head -1)
          
          if [ -z "$IPA_PATH" ]; then
            echo "❌ Error: IPA file not found in build/ios!"
            echo "Listing build directory for debugging:"
            find build/ios -maxdepth 3
            exit 1
          fi
          
          echo "📱 Found IPA at: $IPA_PATH"

          # Upload using xcrun notarytool / altool
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

          echo "✅ Upload complete! Check TestFlight in App Store Connect."

      # ──────────────────────────────────────
      # 8. Cleanup Keychain
      # ──────────────────────────────────────
      - name: Cleanup keychain
        if: ${{ always() }}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
