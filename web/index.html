<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="حاسبة بنت السبيت - SbeetCalc">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#131416">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SbeetCalc">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>SbeetCalc - حاسبة بنت السبيت</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload Rubik fonts to prevent flickering (tofu) on load -->
  <link rel="preload" href="assets/fonts/Rubik-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/Rubik-Bold.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    @font-face {
      font-family: 'Rubik';
      src: url('assets/fonts/Rubik-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Rubik';
      src: url('assets/fonts/Rubik-Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }

    /* Dark background to match app theme - prevents white flash */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #131416;
    }
  </style>
</head>

<body>
  <script>
    // Use HTML renderer — skips the 6.8MB CanvasKit WASM download
    // Much faster initial load for form/list-based apps
    window.flutterConfiguration = {
      renderer: "html",
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
