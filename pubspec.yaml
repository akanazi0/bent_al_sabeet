name: bent_al_sabeet
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

# إعدادات الأيقونات (يجب أن تبدأ من أول السطر)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon.png"
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo02.png
    - assets/images/logo.png
    - assets/images/logo_light.png
    - assets/icon.png
    - assets/fonts/

  fonts:
    - family: Camel
      fonts:
        - asset: assets/fonts/Camel.otf
